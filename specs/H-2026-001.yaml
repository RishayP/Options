# specified -- see the measurement note in Hypotheses.md.
sample_size_expected:
  raw_events: 99
  independent_clusters: 87
  per_year: 3.0
  measured_utc: 2026-08-19T00:00:00Z
  measured_at_horizon: 5
  arms:
    sigma:
      raw_events: 99
      independent_clusters: 87
      collapse_ratio: 1.14
      research_window: {raw_events: 67, independent_clusters: 60}
    gap:
      raw_events: 288
      independent_clusters: 165
      collapse_ratio: 1.75
      research_window: {raw_events: 198, independent_clusters: 111}

structure: >
  Not yet chosen; 5 selects it only if a trial survives. Indicative per the
  library entry: reversal implies a short put spread at 7-21 DTE, continuation
  a put debit spread, and a volatility-only result implies a long straddle or,
  more likely, an exclusion filter applied to short-volatility candidates.

slice_plan: {stage1: STAGE1, stage2: HOLDOUT}

# ---------------------------------------------------------------------------
# The eight trials. PROGRAM.md permits no ninth. Directional outcomes are
# tested ONLY on the one-sided sigma arm, because a signed prediction from an
# absolute-value trigger has no mechanism behind it.
# ---------------------------------------------------------------------------
trials:
  - name: sigma_h1_logret
    params: {arm: sigma, horizon: 1, outcome: logret}
  - name: sigma_h3_logret
    params: {arm: sigma, horizon: 3, outcome: logret}
  - name: sigma_h5_logret
    params: {arm: sigma, horizon: 5, outcome: logret}
  - name: sigma_h5_fwdrv
    params: {arm: sigma, horizon: 5, outcome: fwd_rv}
  - name: sigma_h10_fwdrv
    params: {arm: sigma, horizon: 10, outcome: fwd_rv}
  - name: gap_h5_fwdrv
    params: {arm: gap, horizon: 5, outcome: fwd_rv}
  - name: gap_h10_fwdrv
    params: {arm: gap, horizon: 10, outcome: fwd_rv}
  - name: gap_h5_abslogret
    params: {arm: gap, horizon: 5, outcome: abs_logret}
