[project]
name = "optlab"
version = "0.1.0"
description = "Options hypothesis research pipeline (see Principles.md)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-market-calendars>=5.4.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "yfinance>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optlab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
